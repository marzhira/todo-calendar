<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>하루 할 일 달력</title>
<meta name="theme-color" content="#f7f1e3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <img class="cat cat-logo" src="img/1.png" alt="">
      <h1>하루 할 일 달력<small>DAILY TO-DO</small></h1>
    </div>
    <div class="user">
      <span class="sync" id="sync">연결 중…</span>
      <div class="menu-wrap" id="menuWrap" hidden>
        <button class="icon-btn" id="menuBtn" type="button" aria-label="메뉴" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button>
        <div class="menu" id="menu" role="menu" hidden>
          <div class="menu-title">기록 보관</div>
          <button class="menu-item" id="exportCsv" role="menuitem" type="button">엑셀용 CSV 내려받기</button>
          <button class="menu-item" id="exportJson" role="menuitem" type="button">백업 파일 내려받기</button>
          <label class="menu-item" for="importFile" role="menuitem">백업 불러오기</label>
          <input type="file" id="importFile" accept=".json,application/json" hidden>
          <p class="menu-note" id="backupNote" aria-live="polite"></p>
          <hr>
          <button class="menu-item" id="logout" role="menuitem" type="button">로그아웃</button>
        </div>
      </div>
    </div>
  </header>

  <section class="login panel" id="login" hidden>
    <div class="brand">
      <img class="cat" src="img/1.png" alt="">
      <img class="cat" src="img/2.png" alt="">
    </div>
    <h2>어서 와요!</h2>
    <p>구글 계정으로 로그인하면 휴대폰과 PC에서 같은 할 일 목록을 쓸 수 있어요.</p>
    <button class="btn primary" id="loginBtn">Google로 로그인</button>
  </section>

  <section class="panel" id="calPanel" aria-label="달력" hidden>
    <div class="cal-head">
      <button class="btn" id="prev" aria-label="이전 달">‹</button>
      <h2 id="monthLabel"></h2>
      <button class="btn" id="next" aria-label="다음 달">›</button>
    </div>
    <div class="grid" id="dows"></div>
    <div class="grid" id="cal"></div>
    <div class="legend">날짜 칸의 색이 차오른 만큼 그날의 달성률이에요. <button class="btn" id="goToday" style="margin-left:6px;padding:2px 10px">오늘</button></div>
  </section>

  <section class="panel" id="dayPanel" aria-label="선택한 날의 할 일" hidden>
    <div class="day-head">
      <h2 id="dayLabel"></h2>
      <div class="pct-wrap">
        <img class="cat yay" id="yay" src="img/4.png" alt="" hidden>
        <div class="pct" id="pct">0%<small></small></div>
      </div>
    </div>
    <div class="bar"><span id="barFill"></span></div>
    <form class="add" id="addForm">
      <input id="newItem" type="text" placeholder="할 일을 입력하고 Enter" autocomplete="off" maxlength="200">
      <button class="btn primary" type="submit">추가</button>
    </form>
    <ul class="items" id="items"></ul>
    <div class="empty" id="empty" hidden>
      <div class="empty-row">
        <img class="cat cat-small" src="img/2.png" alt="">
        <span>이 날의 할 일이 아직 없어요. 위 칸에 첫 할 일을 적어 보세요.</span>
      </div>
      <button class="btn" id="carry" hidden></button>
    </div>
    <div class="events-box" id="eventsBox" hidden>
      <div class="note-head">
        <span class="note-label">주요 일정</span>
        <button class="link-btn" id="eventsAction" type="button">구글 캘린더 연결</button>
      </div>
      <p class="events-msg" id="eventsMsg"></p>
      <ul class="items events" id="events"></ul>
    </div>
    <div class="note-head">
      <span class="note-label">하루 기록</span>
      <button class="link-btn" id="noteEditBtn" type="button" hidden>수정</button>
    </div>
    <div class="note-view" id="noteView" hidden></div>
    <button class="note-start" id="noteStart" type="button">하루를 짧게 남겨 보세요</button>
    <div class="note-edit" id="noteEdit" hidden>
      <textarea id="note" class="note-box" maxlength="5000" aria-label="하루 기록" placeholder="하루를 짧게 남겨 보세요"></textarea>
      <div class="note-actions">
        <button class="btn" id="noteCancel" type="button">취소</button>
        <button class="btn primary" id="noteSave" type="button">저장</button>
      </div>
    </div>
  </section>

</div>
<footer class="foot" aria-hidden="true">
  <img class="cat" src="img/3.png" alt=""><img class="cat" src="img/4.png" alt="">
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
